services:
  - type: web
    name: stackbid-app
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: "24"

  - type: cron
    name: stackbid-price-agent
    runtime: node
    schedule: "0 9 * * *"
    buildCommand: npm install
    startCommand: node price-agent.js
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_EMAIL
        sync: false

  - type: cron
    name: stackbid-market-scan-agent
    runtime: node
    schedule: "0 8 * * 1"
    buildCommand: npm install
    startCommand: node market-scan-agent.js
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # Бесплатный обходной путь для холодного старта free-плана: стучится на
  # сайт каждые 10 минут, чтобы Render не успевал усыплять инстанс (засыпает
  # после 15 минут простоя). НЕ настоящий фикс — настоящий фикс это платный
  # план (Render → Settings → Instance Type → Starter, от $7/мес), который
  # вообще убирает автоусыпление. Это временная мера, пока не решили платить.
  - type: cron
    name: stackbid-keep-alive
    runtime: node
    schedule: "*/10 * * * *"
    buildCommand: "true"
    startCommand: "curl -sf https://stackbid-app.onrender.com/ -o /dev/null || true"

  # Публікація промо-відео у всі соцмережі — пряма заміна Make-сценарію
  # 5571686 (той самий принцип, що і для Cartobi: один прямий виклик
  # Upload-Post замість зв'язки Make+Cloudinary+нативні модулі).
  - type: cron
    name: stackbid-video-poster
    runtime: node
    schedule: "*/15 * * * *"
    buildCommand: npm install
    startCommand: node video-poster-agent.js
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: UPLOAD_POST_KEY
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: GA4_SERVICE_ACCOUNT_JSON
        sync: false

  # Ника-Ревизор (ідея з AI Mapper 07.09) — щодня перевіряє нові діалоги
  # Nika на вигадані ціни/обіцянки гарантій, шле звіт на пошту.
  - type: cron
    name: stackbid-nika-reviewer
    runtime: node
    schedule: "0 10 * * *"
    buildCommand: npm install
    startCommand: node nika-reviewer.js
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false
      - key: ZOHO_ACCOUNT_ID
        sync: false
      - key: REPORT_TO_EMAIL
        sync: false

  # Лицензия-Чек (ідея з AI Mapper 07.09) — щотижня шле дайджест
  # непідтверджених ліцензій підрядників з готовими посиланнями на
  # офіційні безкоштовні реєстри штатів (жоден штат не дає безкоштовного
  # API, тому це не автоматична перевірка, а прибрана вручну черга).
  - type: cron
    name: stackbid-license-check
    runtime: node
    schedule: "0 9 * * 1"
    buildCommand: npm install
    startCommand: node license-check-agent.js
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false
      - key: ZOHO_ACCOUNT_ID
        sync: false
      - key: REPORT_TO_EMAIL
        sync: false

  # Анти-Отток (ідея з AI Mapper 07.09) — щотижня шле дайджест підрядників
  # у зоні ризику відмови від підписки (0 конверсій, 0 лідів, або тиша
  # 30+ днів), використовуючи тільки вже існуючі колонки contractors.
  - type: cron
    name: stackbid-churn-risk
    runtime: node
    schedule: "0 9 * * 1"
    buildCommand: npm install
    startCommand: node churn-risk-agent.js
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false
      - key: ZOHO_ACCOUNT_ID
        sync: false
      - key: REPORT_TO_EMAIL
        sync: false

  # Оферта-Барьер (ідея з AI Mapper 07.09) — щотижня перевіряє тексти
  # сайту та промпт Nika на юридично ризиковані формулювання (обіцянки
  # точної/гарантованої ціни), постійний страж, не разова перевірка.
  - type: cron
    name: stackbid-offer-barrier
    runtime: node
    schedule: "0 9 * * 1"
    buildCommand: npm install
    startCommand: node offer-barrier-agent.js
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false
      - key: ZOHO_ACCOUNT_ID
        sync: false
      - key: REPORT_TO_EMAIL
        sync: false

  # Отзыв-Добытчик (ідея з AI Mapper 07.09) — щодня шле запит на відгук
  # домовласникам через 14-28 днів після закриття ліда. ПОТРЕБУЄ нової
  # nullable-колонки (review-requested-at-migration.sql) — ще не
  # застосовано, чекає дозволу на зміну схеми.
  - type: cron
    name: stackbid-review-request
    runtime: node
    schedule: "0 14 * * *"
    buildCommand: npm install
    startCommand: node review-request-agent.js
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false

  # Онбординг-Мастер (ідея з AI Mapper 07.09, адаптована) — нагадує
  # контракторам, які зареєструвались, але не завершили оплату (subscription_active
  # лишається false), через 3 дні після реєстрації. Фільтр на license_number
  # захищає від хибних нагадувань імпортованому каталогу (не справжнім реєстраціям).
  - type: cron
    name: stackbid-onboarding-nudge
    runtime: node
    schedule: "0 15 * * *"
    buildCommand: npm install
    startCommand: node onboarding-nudge-agent.js
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false

  # Автоматизация-Ревизор (ідея з AI Mapper 07.09) — щомісяця сканує
  # репозиторій на маркери ручних процесів (TODO/manually/вручную),
  # збирає розкидане по файлах в один список.
  - type: cron
    name: stackbid-automation-audit
    runtime: node
    schedule: "0 9 1 * *"
    buildCommand: npm install
    startCommand: node automation-audit-agent.js
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false
      - key: ZOHO_ACCOUNT_ID
        sync: false
      - key: REPORT_TO_EMAIL
        sync: false
      - key: REPORT_TO_EMAIL
        sync: false

  # Отчёт-аналитик раз в 3 дня — регистрации/сметы/тарифы/how_heard.
  # НЕ дублирует Google Analytics (трафик/страницы уже там, G-FRXYX65KWN) —
  # это только бизнес-метрики из наших таблиц.
  - type: cron
    name: stackbid-analytics-agent
    runtime: node
    schedule: "0 9 */3 * *"
    buildCommand: npm install
    startCommand: node analytics-agent.js
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false
      - key: ZOHO_ACCOUNT_ID
        sync: false
      - key: REPORT_TO_EMAIL
        sync: false
      - key: GA4_PROPERTY_ID
        sync: false
      - key: GA4_SERVICE_ACCOUNT_JSON
        sync: false
